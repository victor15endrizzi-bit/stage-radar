<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Radar de stages</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <div class="brand big">🎯 Radar de stages</div>
      <p class="muted">Connecte-toi avec le compte créé dans Supabase.</p>
      <label>E-mail<input type="email" id="login-email" required autocomplete="username"></label>
      <label>Mot de passe<input type="password" id="login-pass" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Se connecter</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">🎯 <span>Radar de stages</span></div>
      <nav id="nav">
        <a href="#home" data-view="home">Accueil</a>
        <a href="#offers" data-view="offers">Offres</a>
        <a href="#pipeline" data-view="pipeline">Candidatures</a>
        <a href="#stats" data-view="stats">Stats</a>
        <a href="#sources" data-view="sources">Sources</a>
        <a href="#settings" data-view="settings">Paramètres</a>
      </nav>
      <button class="btn ghost small" id="add-btn" title="Ajouter une offre à la main">＋ Offre</button>
    </header>
    <main id="view"></main>
  </div>

  <div id="drawer" class="drawer hidden" role="dialog" aria-modal="true">
    <div class="drawer-backdrop" data-close></div>
    <aside class="drawer-panel" id="drawer-panel"></aside>
  </div>
  <div id="toast" class="toast hidden"></div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
