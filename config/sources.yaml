  # ============================================================ SmartRecruiters
  - {id: sr-bank-of-china, name: "Bank of China Luxembourg", kind: smartrecruiters, interval_minutes: 120,
     config: {company_id: BankOfChinaLuxembourg, company: "Bank of China Luxembourg"}}

  # ============================================================ Sites carrière HTML
  - id: candriam
    name: "Candriam"
    kind: links
    interval_minutes: 60
    target: true
    config: {list_urls: ["https://jobs.candriam.com/job/list-of-all-jobs.aspx?all=1&mode=list", "https://jobs.candriam.com/job/list-of-all-jobs.aspx?page=2&all=1&mode=list"],
             link_pattern: "/job/job-[^\"'#?]+_\\d+\\.aspx", base_url: "https://jobs.candriam.com", company: "Candriam",
             fetch_details: true, row_must_contain: [luxembourg]}
  - id: amundi
    name: "Amundi"
    kind: links
    interval_minutes: 60
    target: true
    config: {list_urls: ["https://jobs.amundi.com/offre-de-emploi/liste-toutes-offres.aspx?all=1&mode=list",
                         "https://jobs.amundi.com/offre-de-emploi/liste-toutes-offres.aspx?page=2&all=1&mode=list",
                         "https://jobs.amundi.com/offre-de-emploi/liste-toutes-offres.aspx?page=3&all=1&mode=list"],
             link_pattern: "/offre-de-emploi/emploi-[^\"'#?]+_\\d+\\.aspx", base_url: "https://jobs.amundi.com",
             company: "Amundi (dont Fund Channel)", fetch_details: true, row_must_contain: [luxembourg]}
  - id: quintet
    name: "Quintet Private Bank"
    kind: links
    interval_minutes: 60
    target: true
    config: {list_urls: ["https://www.quintet.com/en-gb/your-career-at-quintet/vacancies"], link_pattern: "/vacancies/job/[^\"'#?]+/\\d+",
             base_url: "https://www.quintet.com", company: "Quintet Private Bank", anchor_must_contain: [luxembourg], fetch_details: true}
  - id: ey-lux
    name: "EY Luxembourg"
    kind: links
    interval_minutes: 60
    config: {list_urls: ["https://careers.ey.com/ey/search/?q=&locationsearch=Luxembourg", "https://careers.ey.com/ey/search/?q=intern&locationsearch=Luxembourg"],
             link_pattern: "/job/Luxembourg-[^\"'#?]+/\\d+/", base_url: "https://careers.ey.com", company: "EY Luxembourg", fetch_details: true}
  - id: alter-domus
    name: "Alter Domus"
    kind: links
    interval_minutes: 60
    target: true
    config: {list_urls: ["https://careers.alterdomus.com/en/location/luxembourg-jobs/1298/2960313/2"], link_pattern: "/en/job/luxembourg/[^\"'#?]+/\\d+/\\d+",
             base_url: "https://careers.alterdomus.com", company: "Alter Domus", fetch_details: true}
  - id: esm
    name: "ESM (Mécanisme européen de stabilité)"
    kind: links
    interval_minutes: 120
    target: true
    config: {list_urls: ["https://www.esm.europa.eu/careers/vacancies"], link_pattern: "/careers/vacancies/\\d+$",
             base_url: "https://www.esm.europa.eu", company: "ESM", fetch_details: true}

  # ============================================================ Moovijob (bloqué depuis GitHub -> passer par les alertes e-mail)
  - id: moovijob-stages
    name: "Moovijob — tous les stages"
    kind: moovijob
    interval_minutes: 20
    enabled: false
    force_enabled: false   # bloqué depuis les serveurs GitHub (403)
    config: {list_url: "https://www.moovijob.com/offres-emploi/jobs-luxembourg/contrat-stage", max_pages: 10, assume_internship: true}
  - id: moovijob-vie-graduate
    name: "Moovijob — Graduate / V.I.E."
    kind: moovijob
    interval_minutes: 60
    enabled: false
    force_enabled: false   # bloqué depuis les serveurs GitHub (403)
    config: {list_url: "https://www.moovijob.com/offres-emploi/jobs-luxembourg/contrat-graduate-program-vie", max_pages: 3, assume_internship: true}

  # ============================================================ Alertes e-mail (Moovijob, LinkedIn, jobs.lu, Indeed, JobTeaser…)
  - id: email-alerts
    name: "Alertes e-mail (Moovijob, LinkedIn, jobs.lu, Indeed, JobTeaser…)"
    kind: email
    interval_minutes: 15
    enabled: false
    config: {imap_host: imap.gmail.com, folder: INBOX, lookback_days: 3}
