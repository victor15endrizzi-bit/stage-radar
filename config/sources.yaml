# Sources surveillées. Copiées en base à chaque passage (`seed`) : une NOUVELLE source
# (identifiant inconnu) est ajoutée automatiquement ; une source existante garde
# ton réglage actif/inactif et sa fréquence, modifiables depuis la page « Sources ».
#
# kind:
#   workday         : API publique des sites carrière Workday (*.myworkdayjobs.com)
#   oracle          : API publique Oracle Recruiting Cloud (JPMorgan, Schroders, BNY…)
#   smartrecruiters : API publique officielle SmartRecruiters
#   links           : page carrière HTML ; on extrait les liens d'offres via un motif (regex)
#   moovijob        : pages de liste Moovijob (bloqué depuis GitHub : erreur 403)
#   email           : alertes e-mail (Moovijob, LinkedIn, jobs.lu, Indeed, JobTeaser…) via Gmail
#
# Toutes les sources ci-dessous ont été testées le 25/10/2026 (réponse OK + offres au Luxembourg).

