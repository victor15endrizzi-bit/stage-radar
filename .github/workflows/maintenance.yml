# Sauvegarde chiffrée hebdomadaire + maintien en vie des tâches planifiées.
name: Maintenance

on:
  schedule:
    - cron: "41 2 * * 0"   # dimanche ~4h à Paris
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sauvegarde chiffrée
        run: python -m radar backup
      - uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-radar
          path: backups/*.enc
          retention-days: 90
      - name: Maintien en vie (1 commit par mois)
        run: |
          month=$(date +%Y-%m)
          if [ "$(cat .github/keepalive 2>/dev/null)" != "$month" ]; then
            echo "$month" > .github/keepalive
            git config user.name "radar-bot"; git config user.email "radar-bot@users.noreply.github.com"
            git add .github/keepalive && git commit -m "keepalive $month" && git push
          fi
