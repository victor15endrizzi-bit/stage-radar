# Le robot : tourne sur les serveurs de GitHub, même ordinateur éteint.
name: Radar

on:
  schedule:
    - cron: "3,23,43 * * * *"   # toutes les 20 min (GitHub peut décaler de quelques minutes)
    - cron: "17 5 * * *"        # récap du matin (~7h à Paris)
  workflow_dispatch:
    inputs:
      mode:
        description: "Action"
        type: choice
        default: run
        options: [run, test-notify, digest, seed, check-source, rescore]
      source:
        description: "Identifiant de source (pour check-source, ou run sur une seule source)"
        required: false

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
      DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Récap du matin
        if: github.event.schedule == '17 5 * * *'
        run: python -m radar digest

      - name: Collecte + alertes
        if: github.event_name == 'schedule' && github.event.schedule != '17 5 * * *'
        run: python -m radar seed && python -m radar run

      - name: Action manuelle
        if: github.event_name == 'workflow_dispatch'
        run: |
          case "${{ inputs.mode }}" in
            run)          python -m radar seed && python -m radar run ${{ inputs.source && format('--source {0} --force', inputs.source) || '--force' }} ;;
            check-source) python -m radar check-source "${{ inputs.source }}" ;;
            *)            python -m radar ${{ inputs.mode }} ;;
          esac
